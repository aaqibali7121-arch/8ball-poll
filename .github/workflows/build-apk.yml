name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o "8ball_mobile_github_build_package.zip" -d project

          echo "===== Extracted files ====="
          find project -maxdepth 6 -type f | head -200

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        run: |
          GRADLEW=$(find "$GITHUB_WORKSPACE/project" -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "The ZIP structure is:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 6 -type f
            exit 1
          fi

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "Found: $GRADLEW"

      - name: Fix Gradle permissions
        run: |
          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Find APK
        run: |
          echo "===== APK files ====="
          find "$GITHUB_WORKSPACE/project" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project/**/*.apk
          if-no-files-found: error
